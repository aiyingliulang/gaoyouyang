<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>稿有样 Draftory</title>
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header class="top"><div class="brand"><img class="brand-logo" src="assets/logo.png" alt=""><div><strong>稿有样 Draftory</strong><small>写好内容，剩下交给稿有样</small></div></div><div class="top-actions"><button id="proButton" class="pro-button" type="button">稿有样 Pro</button><a class="cards" href="cards/cards.html">小红书图文卡片 <span>↗</span></a></div></header>
<main><section class="intro"><div><p class="eyebrow">YOUR WRITING WORKSPACE <span>✳</span></p><h1>让文字，<em>好好呈现。</em></h1><p class="sub">在这里写作、排版，然后把灵感带到公众号。</p></div><div class="intro-note"><span>✦</span> 写下想法<br>剩下的交给排版</div></section>
<section class="workspace" aria-label="排版工作区"><div class="toolbar"><div class="theme-control"><label for="theme">公众号主题</label><select id="theme"><option value="default">默认 · 青绿</option><option value="simple">简约 · 黑白</option><option value="literary">文艺 · 暖棕</option></select></div><div class="stats"><span><b id="count">0</b> 字</span><i></i><span>约 <b id="readtime">0</b> 分钟阅读</span></div><div class="actions"><button id="check" class="secondary">◎ &nbsp;违规词自查</button><button id="advanced" class="secondary" type="button" aria-pressed="false">🔒 高级自查</button><button id="copy" class="primary">复制富文本 <span>↗</span></button></div></div>
<div id="proPanel" class="pro-panel" hidden><div class="pro-panel-head"><span>稿有样 Pro 已激活</span><button id="deactivate" class="text-button" type="button">取消激活</button></div><label for="customWords">自定义词库（每行一个词）</label><textarea id="customWords" rows="3" placeholder="每行输入一个词"></textarea><span id="customSaved" class="custom-saved" aria-live="polite">自动保存于当前浏览器</span></div><div class="panes"><section class="pane edit-pane"><div class="pane-head"><div><span class="dot teal"></span><strong>Markdown 编辑</strong><small>在此输入你的内容</small></div><span class="saved" id="saved">自动保存</span></div><div class="editor-wrap"><div id="highlight" class="highlight" aria-hidden="true"></div><textarea id="editor" aria-label="Markdown 编辑区" spellcheck="false" placeholder="从这里开始写作…"></textarea></div><div id="results" class="results" aria-live="polite">点击「违规词自查」检查内容</div></section><section class="pane preview-pane"><div class="pane-head"><div><span class="dot orange"></span><strong>效果预览</strong><small>公众号排版效果</small></div><span class="preview-label">实时预览</span></div><div class="preview-scroll"><article id="preview" class="paper"></article></div></section></div></section><footer><span>稿有样 Draftory &nbsp; / &nbsp; 为每一个好想法排版</span><span>草稿保存在当前浏览器中</span></footer></main><dialog id="activationDialog" aria-labelledby="dialogTitle"><form id="activationForm"><div class="dialog-head"><h2 id="dialogTitle">稿有样 Pro</h2><button id="closeDialog" class="dialog-close" type="button" aria-label="关闭">×</button></div><p id="dialogDescription">解锁扩展词库高级自查与自定义词库。</p><div id="activationFields"><label for="activationCode">输入激活码</label><input id="activationCode" type="text" autocomplete="off" spellcheck="false" placeholder="GY-XXXX-XXXX-XXXX"><p id="activationError" class="activation-error" role="alert"></p><button class="primary activate-button" type="submit">激活</button></div><button id="dialogDeactivate" class="secondary" type="button" hidden>取消激活</button></form></dialog><div id="toast" role="status" aria-live="polite"></div>
</body></html>
